<!DOCTYPE html>
<!--
  Market Daily: swipe view (installable web app).
  Static shell, no build step. Reads ../data/prices.json and ../data/brief.json (the same files as the
  dashboard). One screen per card; swipe up for the next, tap "Full view" for the bottom sheet.
  Order: cover, "How it connects" theme cards (brief.themes), then one card per covered asset.
  Nothing here is a recommendation: "Street view" is the analyst consensus Yahoo Finance reports.
-->
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Market Daily Swipe</title>
<meta name="description" content="Today's Market Daily, one stock or theme per screen: valuation, trend, analyst view and how the news connects. Swipe up for the next.">
<meta name="theme-color" content="#080B0F" id="themecolor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Market Daily">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<script>try { var t = localStorage.getItem("md_theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root,[data-theme="dark"]{
    --bg:#080B0F; --surface:#10151B; --surface-2:#171F28; --line:#1F2832;
    --ink:#F4F5F7; --ink-2:#D0D5DC; --muted:#A4ACB9;
    --up:#2FD16A; --down:#FF4D4D; --flat:#9AA3AF; --gold:#D9B45C;
    --up-soft:rgba(47,209,106,.13); --down-soft:rgba(255,77,77,.13); --flat-soft:rgba(154,163,175,.13);
    --accent:#4FB3FF; --accent-soft:rgba(79,179,255,.14);
    --sans:'Inter',system-ui,-apple-system,sans-serif;
    --top:calc(env(safe-area-inset-top,0px) + 92px); --bottom:env(safe-area-inset-bottom,0px);
    color-scheme:dark;
  }
  [data-theme="light"]{
    --bg:#F5F6F8; --surface:#FFFFFF; --surface-2:#EEF1F4; --line:#DDE1E6;
    --ink:#0F1216; --ink-2:#38404A; --muted:#646D79;
    --up:#0B7A36; --down:#C62828; --flat:#6B7280; --gold:#9A6B00;
    --up-soft:rgba(11,122,54,.10); --down-soft:rgba(198,40,40,.09); --flat-soft:rgba(107,114,128,.10);
    --accent:#0A66C2; --accent-soft:rgba(10,102,194,.09);
    color-scheme:light;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%}
  body{overflow:hidden;overscroll-behavior:none}
  a{color:var(--accent)}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  .num{font-variant-numeric:tabular-nums}
  .up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}

  /* top bar: brand, date, group chips, progress */
  .bar{position:fixed;inset:0 0 auto 0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 8px) 0 0;border-bottom:1px solid var(--line)}
  .bar-row{display:flex;align-items:center;gap:10px;max-width:560px;margin:0 auto;height:36px;padding:0 16px}
  .bar img{width:24px;height:24px;border-radius:6px}
  .bar .name{font-weight:800;font-size:16px;letter-spacing:-.2px;white-space:nowrap}
  .bar .ed{margin-left:auto;font-size:12px;color:var(--muted);text-align:right}
  .bar .tbtn{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--ink-2);border:1px solid var(--line)}
  .chips{display:flex;gap:6px;overflow-x:auto;max-width:560px;margin:0 auto;padding:6px 16px 8px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--ink-2);background:var(--surface)}
  .chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .progress{height:3px;background:var(--surface-2)}
  .progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}

  /* the deck: one slide per screen, snap on swipe */
  .deck{position:fixed;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .slide{height:100vh;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;padding:calc(var(--top) + 12px) 16px calc(var(--bottom) + 16px);display:flex}
  .card{max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .card>*{flex-shrink:0}
  .kicker{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11.5px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
  .tag{border:1px solid var(--line);border-radius:4px;padding:2px 7px;background:var(--surface)}
  .tag.k-politics{color:#E39BFF} .tag.k-geopolitics{color:var(--gold)} .tag.k-tech{color:var(--accent)} .tag.k-macro{color:var(--up)} .tag.k-policy{color:#FF9F5A} .tag.k-earnings{color:var(--ink-2)}
  [data-theme="light"] .tag.k-politics{color:#8A2BB0} [data-theme="light"] .tag.k-policy{color:#B5520B}
  h1{font-weight:800;font-size:clamp(26px,7.4vw,34px);line-height:1.12;letter-spacing:-.5px;margin:12px 0 10px}
  h2{font-weight:800;font-size:clamp(22px,6.4vw,28px);line-height:1.15;letter-spacing:-.4px;margin:8px 0 2px}
  .lede{font-size:clamp(15.5px,4.3vw,17px);line-height:1.5;color:var(--ink-2)}
  .pricerow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:4px}
  .price{font-size:clamp(26px,7.5vw,32px);font-weight:700;letter-spacing:-.5px}
  .pill{font-size:14px;font-weight:700;padding:3px 9px;border-radius:999px}
  .pill.up{background:var(--up-soft)} .pill.down{background:var(--down-soft)} .pill.flat{background:var(--flat-soft)}
  .asof{font-size:12px;color:var(--muted)}
  .spark{display:block;width:100%;height:clamp(48px,9vh,76px);margin:10px 0 4px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:8px}
  .grid div{background:var(--surface);padding:8px 10px;min-width:0}
  .grid b{display:block;font-size:10.5px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .grid span{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .grid small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .trend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .tchip{font-size:12.5px;font-weight:600;border-radius:999px;padding:4px 10px;background:var(--surface-2);color:var(--ink-2)}
  .tchip.up{background:var(--up-soft);color:var(--up)} .tchip.down{background:var(--down-soft);color:var(--down)}
  .why{margin-top:10px;background:var(--surface);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:8px 12px;font-size:14.5px;line-height:1.45}
  .why b,.sec{display:block;font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
  .why .wt{overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3}
  .links{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .lchip{font-size:12.5px;font-weight:600;border:1px solid var(--line);border-radius:6px;padding:4px 8px;color:var(--ink-2);text-align:left}
  .lchip .ar{font-weight:800;margin-left:3px}
  .actions{margin-top:auto;padding-top:12px;display:flex;gap:10px}
  .more{flex:1;border:1px solid var(--ink);border-radius:999px;padding:11px 14px;font-weight:700;font-size:14px;text-align:center}
  .hint{text-align:center;font-size:11px;font-weight:600;letter-spacing:1px;color:var(--muted);margin-top:10px;animation:nudge 1.8s ease-in-out infinite}
  @keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .foot{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.4}

  /* cover */
  .tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}
  .tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;text-align:left}
  .tile b{display:block;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tile span{font-size:16px;font-weight:700}
  .tile em{font-style:normal;font-size:13px;font-weight:700;margin-left:6px}

  /* theme cards */
  .alist{list-style:none;margin-top:12px;border-top:1px solid var(--line);overflow-y:auto;min-height:0;flex-shrink:1}
  .alist li button{display:flex;width:100%;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);text-align:left}
  .alist .an{font-weight:600;font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .alist .dir{font-size:12px;font-weight:700;border-radius:4px;padding:2px 6px}
  .alist .dir.up{background:var(--up-soft)} .alist .dir.down{background:var(--down-soft)} .alist .dir.flat,.alist .dir.mixed{background:var(--flat-soft);color:var(--flat)}
  .alist .mv{font-size:14px;font-weight:700;width:64px;text-align:right}
  .src{font-size:13px;margin-top:10px;color:var(--muted)}
  .src a{font-weight:600}

  /* end */
  .end{justify-content:center;text-align:center;gap:14px}
  .end p{color:var(--muted);line-height:1.5}
  .btn{display:block;border:1px solid var(--ink);border-radius:999px;padding:12px;font-weight:700;text-decoration:none;color:var(--ink)}
  .btn.primary{background:var(--ink);color:var(--bg)}
  .install{border:1px dashed var(--line);border-radius:10px;padding:12px;font-size:14px;line-height:1.5;text-align:left;color:var(--ink-2)}

  /* bottom sheet: full view */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9;opacity:0;pointer-events:none;transition:opacity .2s}
  .scrim.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;max-height:90vh;max-height:90dvh;background:var(--bg);border-top:1px solid var(--line);border-radius:16px 16px 0 0;transform:translateY(105%);transition:transform .25s ease;display:flex;flex-direction:column;max-width:640px;margin:0 auto}
  .sheet.on{transform:none}
  .grab{padding:10px 0 4px;display:flex;justify-content:center;position:relative;touch-action:none}
  .grab::before{content:"";width:40px;height:5px;border-radius:3px;background:var(--line)}
  .close{position:absolute;right:12px;top:4px;font-size:24px;line-height:1;padding:4px 8px;color:var(--muted)}
  .sheet-body{overflow-y:auto;padding:4px 18px calc(var(--bottom) + 28px);-webkit-overflow-scrolling:touch}
  .sheet h3{font-weight:800;font-size:23px;line-height:1.2;margin:8px 0 2px}
  .sheet .sec{margin-top:18px;margin-bottom:6px}
  .sheet p{font-size:15.5px;line-height:1.55;color:var(--ink-2)}
  .kv{width:100%;border-collapse:collapse;font-size:14.5px}
  .kv td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top}
  .kv td:first-child{color:var(--muted);width:46%}
  .kv td:last-child{text-align:right;font-weight:600}
  .conn{list-style:none}
  .conn li{padding:10px 0;border-bottom:1px solid var(--line);font-size:15px;line-height:1.45}
  .conn .d{font-weight:700;display:block;margin-bottom:2px}
  .conn .s{display:block;font-size:12.5px;margin-top:3px}
  .news{list-style:none}
  .news li{padding:9px 0;border-bottom:1px solid var(--line);font-size:15px;line-height:1.4}
  .news a{color:var(--ink);text-decoration:none;font-weight:600}
  .news .n{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
  .tlink{display:inline-block;margin:4px 6px 0 0}

  .status{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--muted)}
  @media (max-width:380px){ .grid div{padding:7px 8px} .grid span{font-size:14px} .grid b{font-size:9.5px;letter-spacing:.2px} .grid small{font-size:10.5px} .tchip{font-size:12px;padding:3px 8px} }
  @media (max-height:740px){
    :root{--top:calc(env(safe-area-inset-top,0px) + 86px)}
    .slide{padding-top:calc(var(--top) + 8px);padding-bottom:calc(var(--bottom) + 10px)}
    h2{font-size:22px;margin-top:4px} .price{font-size:24px} .spark{height:34px;margin:6px 0 2px}
    .grid{margin-top:6px} .grid div{padding:6px 8px} .grid small{display:none}
    .trend{margin-top:8px;gap:5px} .tchip.x{display:none}
    .why{margin-top:8px;padding:6px 10px;font-size:14px} .why .wt{-webkit-line-clamp:2}
    .links{display:none} .hint{display:none} .actions{padding-top:8px} .more{padding:9px 14px}
    .lede{-webkit-line-clamp:6;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
    .tiles{margin-top:10px;gap:6px} .tile{padding:7px 10px} .tile:nth-child(n+5){display:none}
    h1{font-size:24px;margin:8px 0 8px}
    .alist li button{padding:8px 2px}
  }
  @media (max-height:600px){ .foot,.spark{display:none} }
  @media (prefers-reduced-motion: reduce){ .hint{animation:none} .sheet,.scrim,.progress i{transition:none} }
</style>
</head>
<body>
<header class="bar">
  <div class="bar-row">
    <img src="../favicon.svg" alt="">
    <span class="name">Market Daily</span>
    <span class="ed" id="ed"></span>
    <button class="tbtn" id="theme" aria-label="Switch light or dark theme">◐</button>
  </div>
  <nav class="chips" id="chips" aria-label="Jump to section"></nav>
  <div class="progress"><i id="prog"></i></div>
</header>

<main class="deck" id="deck" aria-live="polite"></main>
<div class="status" id="status">Loading today's edition…</div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Full view">
  <div class="grab" id="grab"><button class="close" id="close" aria-label="Close">×</button></div>
  <div class="sheet-body" id="sheet-body"></div>
</section>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var deck = $('deck'), P = null, B = null, A = {}, slides = [], current = 0, sections = [], io = null;

  function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function store(k, v){ try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch(e){ return null; } }
  function isNum(x){ return typeof x === 'number' && isFinite(x); }
  function cls(x){ return !isNum(x) ? 'flat' : x > 0.005 ? 'up' : x < -0.005 ? 'down' : 'flat'; }
  function pct(x, d){ if (!isNum(x)) return 'n/a'; d = d == null ? 1 : d; return (x > 0 ? '+' : x < 0 ? '−' : '') + Math.abs(x).toFixed(d) + '%'; }
  function money(a, v){
    if (!isNum(v)) return 'n/a';
    var cur = {USD: '$', INR: '₹', EUR: '€', GBP: '£', JPY: '¥'}[a.currency];
    var d = v >= 1000 ? 0 : v >= 1 ? 2 : 4;
    if (a.type === 'rate' || /yield/i.test(a.name)) return v.toFixed(2) + '%';
    var s = v.toLocaleString('en-US', {minimumFractionDigits: d, maximumFractionDigits: d});
    return (a.type === 'stock' || a.type === 'etf' || a.type === 'crypto') && cur ? cur + s : s;
  }
  function fmtDate(iso){ try { return new Date(iso + 'T12:00:00Z').toLocaleDateString('en-GB', {day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC'}); } catch(e){ return iso; } }
  function external(a){ a.target = '_blank'; a.rel = 'noopener'; return a; }
  function link(text, href){ var a = el('a', null, text); a.href = href; return external(a); }

  // ---- theme toggle, shared with the dashboard (same localStorage key)
  function setTheme(t){ document.documentElement.dataset.theme = t; $('themecolor').content = t === 'light' ? '#F5F6F8' : '#080B0F'; }
  setTheme(document.documentElement.dataset.theme || 'dark');
  $('theme').onclick = function(){ var t = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'; setTheme(t); store('md_theme', t); };

  // ---- load
  function get(u){ return fetch(u + '?t=' + Date.now(), {cache: 'no-store'}).then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); }); }
  Promise.all([get('../data/prices.json'), get('../data/brief.json').catch(function(){ return get('../data/brief.sample.json'); })])
    .then(function(r){ P = r[0]; B = r[1] || {}; P.assets.forEach(function(a){ A[a.id] = a; }); build(); })
    .catch(function(){ $('status').innerHTML = 'Could not load today\'s data. <br><a href="../">Open the dashboard</a>'; });

  // ---- derived insight, all from prices.json (no opinions of our own)
  function trend(a){
    var out = [], p = a.price;
    if (isNum(a.dma50) && isNum(a.dma200)) {
      var u = p > a.dma50 && a.dma50 > a.dma200, d = p < a.dma50 && a.dma50 < a.dma200;
      out.push({t: u ? 'Uptrend' : d ? 'Downtrend' : 'Mixed trend', c: u ? 'up' : d ? 'down' : ''});
    }
    if (isNum(a.dma50)) out.push({t: (p >= a.dma50 ? 'Above' : 'Below') + ' 50-day avg', c: p >= a.dma50 ? 'up' : 'down'});
    if (isNum(a.dma200)) out.push({t: (p >= a.dma200 ? 'Above' : 'Below') + ' 200-day avg', c: p >= a.dma200 ? 'up' : 'down'});
    var opt = isNum(a.dma50) ? ' x' : '';   // on short screens, drop these when the moving-average chips are there
    if (isNum(a.ret_1m)) out.push({t: '1M ' + pct(a.ret_1m), c: cls(a.ret_1m) + opt});
    if (isNum(a.ret_3m)) out.push({t: '3M ' + pct(a.ret_3m), c: cls(a.ret_3m) + opt});
    return out;
  }
  function offHigh(a){ return isNum(a.hi_52w) && a.hi_52w ? (a.price / a.hi_52w - 1) * 100 : null; }
  function offLow(a){ return isNum(a.lo_52w) && a.lo_52w ? (a.price / a.lo_52w - 1) * 100 : null; }
  function upside(a){ return isNum(a.target_mean) && a.price ? (a.target_mean / a.price - 1) * 100 : null; }
  var REC = {strong_buy: 'Strong buy', buy: 'Buy', hold: 'Hold', underperform: 'Underperform', sell: 'Sell'};
  function street(a){ return a.rec_key ? (REC[a.rec_key] || a.rec_key) : null; }
  function pe(x){ return isNum(x) && x > 0 ? x.toFixed(1) + 'x' : 'n/a'; }

  function sparkSvg(vals){
    var ns = 'http://www.w3.org/2000/svg', svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', '0 0 300 60'); svg.setAttribute('preserveAspectRatio', 'none'); svg.setAttribute('class', 'spark'); svg.setAttribute('aria-hidden', 'true');
    if (!vals || vals.length < 2) return svg;
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals), rng = hi - lo || 1;
    var pts = vals.map(function(v, i){ return [(i / (vals.length - 1)) * 300, 56 - ((v - lo) / rng) * 52]; });
    var col = vals[vals.length - 1] >= vals[0] ? 'var(--up)' : 'var(--down)';
    var area = document.createElementNS(ns, 'path');
    area.setAttribute('d', 'M0,60 L' + pts.map(function(p){ return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' L') + ' L300,60 Z');
    area.setAttribute('fill', col); area.setAttribute('opacity', '.12');
    var line = document.createElementNS(ns, 'polyline');
    line.setAttribute('points', pts.map(function(p){ return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' '));
    line.setAttribute('fill', 'none'); line.setAttribute('stroke', col); line.setAttribute('stroke-width', '2'); line.setAttribute('vector-effect', 'non-scaling-stroke');
    svg.appendChild(area); svg.appendChild(line);
    return svg;
  }
  function arrow(dir){ return dir === 'up' ? '↑' : dir === 'down' ? '↓' : '↕'; }
  function groupLabel(id){ var g = (P.groups || []).filter(function(x){ return x.id === id; })[0]; return g ? g.label : id; }
  function themesFor(id){ return (B.themes || []).filter(function(t){ return (t.assets || []).some(function(x){ return x.id === id; }); }); }

  // ---- slides
  function slide(card){ var s = el('section', 'slide'); s.appendChild(card); deck.appendChild(s); slides.push(s); return s; }

  function coverSlide(){
    var c = el('div', 'card');
    var k = el('div', 'kicker'); k.appendChild(el('span', 'tag', 'Today')); k.appendChild(el('span', null, fmtDate(B.date || (P.generated_at || '').slice(0, 10)))); c.appendChild(k);
    c.appendChild(el('h1', null, B.headline || 'Market Daily'));
    if (B.subhead) c.appendChild(el('p', 'lede', B.subhead));
    var tiles = el('div', 'tiles');
    ['gspc', 'ixic', 'nsei', 'tnx', 'gcf', 'btc-usd'].forEach(function(id){
      var a = A[id]; if (!a || a.error) return;
      var t = el('button', 'tile'); t.appendChild(el('b', null, a.name));
      var v = el('span', 'num', money(a, a.price)); t.appendChild(v);
      t.appendChild(el('em', 'num ' + cls(a.chg_1d_pct), pct(a.chg_1d_pct)));
      t.onclick = function(){ openAsset(id); };
      tiles.appendChild(t);
    });
    c.appendChild(tiles);
    var nT = (B.themes || []).length, nA = cards().length;
    c.appendChild(el('p', 'foot', (nT ? nT + ' themes connecting today\'s news, then ' : '') + nA + ' assets with valuation, trend and analyst view.'));
    c.appendChild(el('div', 'hint', 'SWIPE UP'));
    sections.push({label: 'Today', i: slides.length}); slide(c);
  }

  function themeSlide(t, idx, n){
    var c = el('div', 'card');
    var k = el('div', 'kicker');
    k.appendChild(el('span', 'tag k-' + (t.kind || 'macro'), t.kind || 'theme'));
    k.appendChild(el('span', null, 'How it connects · ' + (idx + 1) + ' of ' + n));
    c.appendChild(k);
    c.appendChild(el('h2', null, t.title));
    if (t.text) { var p = el('p', 'lede', t.text); p.style.marginTop = '8px'; c.appendChild(p); }
    var ul = el('ul', 'alist');
    (t.assets || []).forEach(function(x){
      var a = A[x.id]; if (!a) return;
      var li = el('li'), b = el('button');
      b.appendChild(el('span', 'dir ' + (x.dir || 'mixed'), arrow(x.dir)));
      b.appendChild(el('span', 'an', a.name));
      b.appendChild(el('span', 'mv num ' + cls(a.chg_1d_pct), pct(a.chg_1d_pct)));
      b.onclick = function(){ openAsset(x.id); };
      li.appendChild(b); ul.appendChild(li);
    });
    c.appendChild(ul);
    if (t.url) { var s = el('div', 'src'); s.appendChild(document.createTextNode('Source: ')); s.appendChild(link(t.source || 'link', t.url)); c.appendChild(s); }
    c.appendChild(el('p', 'foot', 'Arrows show the direction the story links to each asset. Moves are the last session.'));
    return slide(c);
  }

  function cards(){
    var order = (P.groups || []).map(function(g){ return g.id; });
    var ids = Object.keys(B.assets || {}).filter(function(id){ return A[id] && !A[id].error; });
    var typeRank = function(a){ return a.type === 'stock' ? 0 : 1; };
    return ids.map(function(id){ return A[id]; }).sort(function(x, y){
      return (order.indexOf(x.group) - order.indexOf(y.group)) || (typeRank(x) - typeRank(y)) || (Math.abs(y.chg_1d_pct || 0) - Math.abs(x.chg_1d_pct || 0));
    });
  }

  function statGrid(a){
    var g = el('div', 'grid'), cell = function(label, val, sub, c){ var d = el('div'); d.appendChild(el('b', null, label)); d.appendChild(el('span', 'num ' + (c || ''), val)); if (sub) d.appendChild(el('small', null, sub)); g.appendChild(d); };
    if (a.type === 'stock') {
      cell('P/E', pe(a.pe_ttm), 'trailing');
      cell('Fwd P/E', pe(a.pe_fwd), 'next 12m');
      var st = street(a);
      cell('Analysts', st || 'n/a', a.target_n ? a.target_n + ' analysts' : '', st ? (/buy/i.test(st) ? 'up' : /sell|under/i.test(st) ? 'down' : '') : '');
      var u = upside(a);
      cell('Avg target', isNum(a.target_mean) ? money(a, a.target_mean) : 'n/a', isNum(u) ? pct(u) + ' vs price' : '', cls(u));
    } else {
      cell('1W', pct(a.ret_1w), '', cls(a.ret_1w));
      cell('6M', pct(a.ret_6m), '', cls(a.ret_6m));
      cell('1Y', pct(a.ret_1y), '', cls(a.ret_1y));
      cell('5Y', pct(a.ret_5y), '', cls(a.ret_5y));
    }
    var oh = offHigh(a), ol = offLow(a);
    cell('52w high', isNum(oh) ? pct(oh) : 'n/a', 'from high', isNum(oh) && oh > -0.05 ? 'up' : '');
    cell('52w low', isNum(ol) ? pct(ol) : 'n/a', 'above low');
    return g;
  }

  function assetSlide(a){
    var info = (B.assets || {})[a.id] || {}, c = el('div', 'card');
    var k = el('div', 'kicker'); k.appendChild(el('span', 'tag', groupLabel(a.group))); k.appendChild(el('span', null, a.symbol + (a.sector ? ' · ' + a.sector : ''))); c.appendChild(k);
    c.appendChild(el('h2', null, a.name));
    var pr = el('div', 'pricerow');
    pr.appendChild(el('span', 'price num', money(a, a.price)));
    pr.appendChild(el('span', 'pill num ' + cls(a.chg_1d_pct), pct(a.chg_1d_pct)));
    pr.appendChild(el('span', 'asof', fmtDate(a.as_of)));
    c.appendChild(pr);
    c.appendChild(sparkSvg(a.spark));
    c.appendChild(statGrid(a));
    var tr = el('div', 'trend'); trend(a).forEach(function(x){ tr.appendChild(el('span', 'tchip ' + x.c, x.t)); }); c.appendChild(tr);
    if (info.why) { var w = el('div', 'why'); w.appendChild(el('b', null, 'Why it moved')); w.appendChild(el('div', 'wt', info.why)); c.appendChild(w); }
    var drivers = (info.links || []).slice(0, 3);
    if (drivers.length) {
      var l = el('div', 'links');
      drivers.forEach(function(x){ var b = el('button', 'lchip'); b.appendChild(document.createTextNode(x.driver)); b.appendChild(el('span', 'ar ' + (x.dir || ''), arrow(x.dir))); b.onclick = function(){ openSheet(a); }; l.appendChild(b); });
      c.appendChild(l);
    }
    var act = el('div', 'actions'), more = el('button', 'more', 'Full view ↑'); more.onclick = function(){ openSheet(a); }; act.appendChild(more); c.appendChild(act);
    c.addEventListener('click', function(e){ if (!e.target.closest('button,a')) openSheet(a); });
    var s = slide(c); s.dataset.id = a.id; return s;
  }

  function endSlide(){
    var c = el('div', 'card end');
    c.appendChild(el('h2', null, 'That\'s today'));
    c.appendChild(el('p', null, 'Prices are end of day from Yahoo Finance. Street view and targets are the analyst consensus Yahoo reports. Links between news and assets come from the cited stories. Nothing here is a recommendation.'));
    var d = el('a', 'btn primary', 'Open the full dashboard'); d.href = '../'; c.appendChild(d);
    var t = el('button', 'btn', 'Back to the top'); t.onclick = function(){ go(0); }; c.appendChild(t);
    var standalone = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
    if (!standalone) c.appendChild(el('div', 'install', 'Add to your home screen: in Safari tap Share, then "Add to Home Screen". In Chrome tap the ⋮ menu, then "Add to Home screen". It opens full screen and works offline with the last edition.'));
    slide(c);
  }

  function build(){
    $('status').remove();
    $('ed').textContent = fmtDate(B.date || (P.generated_at || '').slice(0, 10));
    coverSlide();
    var th = B.themes || [];
    if (th.length) { sections.push({label: 'Connections', i: slides.length}); th.forEach(function(t, i){ themeSlide(t, i, th.length); }); }
    var seen = {};
    cards().forEach(function(a){
      if (!seen[a.group]) { seen[a.group] = 1; sections.push({label: groupLabel(a.group).replace('Metals and commodities', 'Metals'), i: slides.length}); }
      assetSlide(a);
    });
    endSlide();
    var chips = $('chips');
    sections.forEach(function(s){ var b = el('button', 'chip', s.label); b.onclick = function(){ go(s.i); }; s.btn = b; chips.appendChild(b); });
    io = new IntersectionObserver(function(es){
      es.forEach(function(e){ if (e.isIntersecting) { current = slides.indexOf(e.target); onSlide(); } });
    }, {root: deck, threshold: 0.6});
    slides.forEach(function(s){ io.observe(s); });
    var want = (location.hash || '').slice(1);
    if (want && A[want]) openAsset(want, true);
    onSlide();
  }
  function onSlide(){
    $('prog').style.width = ((current + 1) / slides.length * 100) + '%';
    var on = null; sections.forEach(function(s){ if (current >= s.i) on = s; });
    sections.forEach(function(s){ s.btn.classList.toggle('on', s === on); });
    if (on && on.btn.scrollIntoView) { var r = on.btn.getBoundingClientRect(), pr = $('chips').getBoundingClientRect(); if (r.left < pr.left || r.right > pr.right) $('chips').scrollLeft += r.left - pr.left - 16; }
  }
  function go(i, instant){ i = Math.max(0, Math.min(slides.length - 1, i)); deck.scrollTo({top: slides[i].offsetTop, behavior: instant ? 'auto' : 'smooth'}); }
  function openAsset(id, instant){
    closeSheet();
    var i = -1; slides.forEach(function(s, k){ if (s.dataset.id === id) i = k; });
    if (i >= 0) go(i, instant); else if (A[id]) openSheet(A[id]);
  }
  document.addEventListener('keydown', function(e){
    if ($('sheet').classList.contains('on')) { if (e.key === 'Escape') closeSheet(); return; }
    if (e.key === 'ArrowDown' || e.key === 'j' || e.key === ' ') { e.preventDefault(); go(current + 1); }
    if (e.key === 'ArrowUp' || e.key === 'k') { e.preventDefault(); go(current - 1); }
  });

  // ---- full view sheet
  function row(t, k, v, c){ var tr = el('tr'); tr.appendChild(el('td', null, k)); tr.appendChild(el('td', 'num ' + (c || ''), v)); t.appendChild(tr); }
  function openSheet(a){
    var info = (B.assets || {})[a.id] || {}, b = $('sheet-body'); b.innerHTML = '';
    var k = el('div', 'kicker'); k.appendChild(el('span', 'tag', groupLabel(a.group))); k.appendChild(el('span', null, a.symbol)); b.appendChild(k);
    b.appendChild(el('h3', null, a.name));
    var pr = el('div', 'pricerow'); pr.appendChild(el('span', 'price num', money(a, a.price))); pr.appendChild(el('span', 'pill num ' + cls(a.chg_1d_pct), pct(a.chg_1d_pct))); pr.appendChild(el('span', 'asof', fmtDate(a.as_of))); b.appendChild(pr);
    if (info.why) { b.appendChild(el('div', 'sec', 'Why it moved')); b.appendChild(el('p', null, info.why)); }

    var links = info.links || [], th = themesFor(a.id);
    if (links.length || th.length) {
      b.appendChild(el('div', 'sec', 'How it connects'));
      var ul = el('ul', 'conn');
      links.forEach(function(x){
        var li = el('li'), d = el('span', 'd'); d.appendChild(document.createTextNode(x.driver + ' ')); d.appendChild(el('span', x.dir || '', arrow(x.dir))); li.appendChild(d);
        li.appendChild(document.createTextNode(x.text || ''));
        if (x.url) { var s = el('span', 's'); s.appendChild(link(x.source || 'source', x.url)); li.appendChild(s); }
        ul.appendChild(li);
      });
      b.appendChild(ul);
      if (th.length) {
        var tw = el('div'); tw.style.marginTop = '8px';
        th.forEach(function(t){ var x = (t.assets || []).filter(function(y){ return y.id === a.id; })[0]; var bt = el('button', 'lchip tlink', t.title + ' '); bt.appendChild(el('span', 'ar ' + (x.dir || ''), arrow(x.dir))); bt.onclick = function(){ closeSheet(); var i = slides.findIndex(function(s){ return s.querySelector('h2') && s.querySelector('h2').textContent === t.title; }); if (i >= 0) go(i); }; tw.appendChild(bt); });
        b.appendChild(tw);
      }
    }

    b.appendChild(el('div', 'sec', a.type === 'stock' ? 'Valuation and analyst view' : 'Performance'));
    var t = el('table', 'kv');
    if (a.type === 'stock') {
      row(t, 'P/E, trailing 12m', pe(a.pe_ttm));
      row(t, 'P/E, next 12m (forward)', pe(a.pe_fwd));
      if (isNum(a.pe_ttm) && isNum(a.pe_fwd) && a.pe_ttm > 0 && a.pe_fwd > 0) row(t, 'Earnings growth implied by the two P/Es', pct((a.pe_ttm / a.pe_fwd - 1) * 100), cls(a.pe_ttm - a.pe_fwd));
      row(t, 'Street view', street(a) ? street(a) + (isNum(a.rec_mean) ? ' · ' + a.rec_mean.toFixed(1) + '/5' : '') : 'n/a');
      row(t, 'Average target', isNum(a.target_mean) ? money(a, a.target_mean) + ' from ' + a.target_n + ' analysts' : 'n/a');
      var u = upside(a); row(t, 'Target vs price', isNum(u) ? pct(u) : 'n/a', cls(u));
      if (a.sector) row(t, 'Sector', a.sector);
    }
    row(t, '1 week', pct(a.ret_1w), cls(a.ret_1w)); row(t, '1 month', pct(a.ret_1m), cls(a.ret_1m)); row(t, '3 months', pct(a.ret_3m), cls(a.ret_3m));
    row(t, '6 months', pct(a.ret_6m), cls(a.ret_6m)); row(t, '1 year', pct(a.ret_1y), cls(a.ret_1y)); row(t, '5 years', pct(a.ret_5y), cls(a.ret_5y));
    row(t, '52-week range', money(a, a.lo_52w) + ' to ' + money(a, a.hi_52w));
    if (isNum(a.dma50)) row(t, '50-day average', money(a, a.dma50) + ' (' + pct((a.price / a.dma50 - 1) * 100) + ')', cls(a.price - a.dma50));
    if (isNum(a.dma200)) row(t, '200-day average', money(a, a.dma200) + ' (' + pct((a.price / a.dma200 - 1) * 100) + ')', cls(a.price - a.dma200));
    b.appendChild(t);
    var tr = trend(a); if (tr.length) { var tw2 = el('div', 'trend'); tr.forEach(function(x){ tw2.appendChild(el('span', 'tchip ' + x.c, x.t)); }); b.appendChild(tw2); }
    b.appendChild(el('p', 'foot', 'Trend: uptrend means the price is above its 50-day average and the 50-day is above the 200-day; downtrend is the reverse. A description of the chart, not a forecast.'));

    if (info.outlook_1y || info.outlook_lt) {
      b.appendChild(el('div', 'sec', 'Cited outlook'));
      if (info.outlook_1y) b.appendChild(el('p', null, '12 months: ' + info.outlook_1y));
      if (info.outlook_lt) { var p2 = el('p', null, 'Longer term: ' + info.outlook_lt); p2.style.marginTop = '6px'; b.appendChild(p2); }
    }
    if ((info.news || []).length) {
      b.appendChild(el('div', 'sec', 'News'));
      var nl = el('ul', 'news');
      info.news.forEach(function(n){ var li = el('li'); li.appendChild(link(n.title, n.url)); li.appendChild(el('span', 'n', n.source + (n.date ? ' · ' + fmtDate(n.date) : ''))); nl.appendChild(li); });
      b.appendChild(nl);
    }
    b.appendChild(el('p', 'foot', 'Not a recommendation. Street view is the analyst rating on Yahoo\'s 1 (strong buy) to 5 (sell) scale; it and the targets are the consensus Yahoo Finance reports. P/E is Yahoo\'s figure and can be missing for some Indian stocks.'));
    b.scrollTop = 0;
    $('sheet').classList.add('on'); $('scrim').classList.add('on');
    try { history.replaceState(null, '', '#' + a.id); } catch(e){}
  }
  function closeSheet(){ $('sheet').classList.remove('on'); $('scrim').classList.remove('on'); $('sheet').style.transform = ''; try { history.replaceState(null, '', location.pathname + location.search); } catch(e){} }
  $('scrim').onclick = closeSheet; $('close').onclick = closeSheet;
  // drag the handle (or the top of the sheet) down to close
  (function(){
    var sheet = $('sheet'), body = $('sheet-body'), y0 = null, dy = 0;
    sheet.addEventListener('touchstart', function(e){ if (body.scrollTop <= 0 || e.target.closest('.grab')) { y0 = e.touches[0].clientY; dy = 0; } }, {passive: true});
    sheet.addEventListener('touchmove', function(e){ if (y0 === null) return; dy = e.touches[0].clientY - y0; if (dy > 0) { sheet.style.transition = 'none'; sheet.style.transform = 'translateY(' + dy + 'px)'; } }, {passive: true});
    sheet.addEventListener('touchend', function(){ sheet.style.transition = ''; if (y0 !== null && dy > 90) closeSheet(); else sheet.style.transform = ''; y0 = null; });
  })();

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
</body>
</html>
